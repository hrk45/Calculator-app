version: '3.8'

services:
  calculator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: calculator-app
    image: calculator-app:1.0.0
    ports:
      - "8080:8080"
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx512m
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/calculator/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

